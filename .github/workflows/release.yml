name: Release

# On main: opens a "Version packages" PR from pending changesets. Merging that PR publishes to npm
# with provenance, through npm trusted publishing (no token stored in the repository). Every push then
# syncs the GitHub releases with the CHANGELOG.md sections: one release per published version.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: changesets/action@v1
        id: changesets
        with:
          version: bunx changeset version
          publish: bunx changeset publish
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # changesets/action only creates releases from "New tag:" lines, which changeset 3 no longer prints.
  # A job of its own reads the changelogs of the pushed commit, never the Version packages branch the
  # action leaves checked out, so it runs on every push: missing releases appear without a new version.
  github-releases:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sync-releases.ts tags each version on the commit that set it
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: GitHub releases from the changelogs
        run: bun scripts/sync-releases.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
