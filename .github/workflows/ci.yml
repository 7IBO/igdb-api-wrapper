name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a change on IGDB's side shows up even without commits.
    - cron: "0 3 * * *"
  # The release workflow starts CI this way on the "Version packages" PR: pushes made with
  # GITHUB_TOKEN trigger no workflow, so its required checks would never report.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Generated schema is up to date
        run: bun run codegen && git diff --exit-code packages/igdb-kit/src/generated
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter igdb-kit lint:package

  redis:
    name: Redis adapters
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --filter igdb-kit test:redis
        env:
          REDIS_URL: redis://localhost:6379

  types:
    name: Type tests on TypeScript ${{ matrix.ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ["5.9", "6.0", "7.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: tsc ${{ matrix.ts }}
        working-directory: packages/igdb-kit
        run: |
          case "${{ matrix.ts }}" in
            7.0) TSC=../../node_modules/typescript/bin/tsc ;;
            *) TSC=../../node_modules/typescript-${{ matrix.ts }}/bin/tsc ;;
          esac
          $TSC --noEmit -p test/types

  node:
    name: Built package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test ESM and CJS
        working-directory: packages/igdb-kit
        run: |
          node --input-type=module -e "import { createIGDB } from './dist/index.js'; const q = createIGDB({ clientId: 'a', clientSecret: 'b' }).games.select('name').where((g) => g.rating.gt(1)); if (q.toApicalypse() !== 'fields name; where rating > 1;') process.exit(1)"
          node -e "const { createIGDB } = require('./dist/index.cjs'); createIGDB({ clientId: 'a', clientSecret: 'b' }).games.limit(1).toApicalypse()"
          node --input-type=module -e "import { redisCache } from 'igdb-kit/redis'; if (typeof redisCache !== 'function') process.exit(1)"
          node -e "const { redisLimiter } = require('igdb-kit/redis'); if (typeof redisLimiter !== 'function') process.exit(1)"
          node --input-type=module -e "import { webhookHandler } from 'igdb-kit/webhooks'; if (typeof webhookHandler !== 'function') process.exit(1)"
          node -e "const { parseWebhook } = require('igdb-kit/webhooks'); if (typeof parseWebhook !== 'function') process.exit(1)"
          node --input-type=module -e "import { igdbProxy } from 'igdb-kit/proxy'; import { createIGDB } from 'igdb-kit'; const h = igdbProxy({ igdb: createIGDB({ clientId: 'a', clientSecret: 'b' }), endpoints: ['games'] }); const r = await h(new Request('http://x/api/igdb/genres', { method: 'POST', body: 'fields name;' })); if (r.status !== 404) process.exit(1)"
          node -e "const { igdbProxy } = require('igdb-kit/proxy'); const { createIGDB } = require('igdb-kit'); igdbProxy({ igdb: createIGDB({ clientId: 'a', clientSecret: 'b' }) })"
          node --input-type=module -e "import { releaseDate } from 'igdb-kit/game'; if (releaseDate({ release_dates: [{ id: 1, date: 0, date_format: 0, release_region: 8, platform: 6 }] }).year !== 1970) process.exit(1)"
          node -e "const { formatPlaytime } = require('igdb-kit/game'); if (formatPlaytime(7200, { locale: 'en-US' }) !== '2 hr') process.exit(1)"

  integration:
    name: Integration tests (real IGDB API)
    runs-on: ubuntu-latest
    # Needs TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET repository secrets; forks do not get them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --filter igdb-kit test:integration
